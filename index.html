<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TenderPack Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{--bg:#eef3fb;--c:#fff;--t:#1b2433;--m:#5d6b82;--b:#d3ddee;--p:#1e4fa3;--r:#c0262d;--o:#b85c00;--g:#17783a;--a:#0e9f9f;--rb:#fdecec;--ob:#fff1de;--gb:#e6f6ec;--nb:#eef0f4}
@media(prefers-color-scheme:dark){:root{--bg:#0e1420;--c:#172033;--t:#e8edf5;--m:#9aa8bd;--b:#2c3a52;--p:#6b9cf0;--r:#ff7b80;--o:#ffa94d;--g:#52d17f;--a:#3fd0d0;--rb:#3a1d22;--ob:#38281a;--gb:#16301f;--nb:#242d3d}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;gap:12px;align-items:center;padding:12px 20px;background:linear-gradient(90deg,#1e4fa3,#0e9f9f);color:#fff;flex-wrap:wrap}header button,header select{color:var(--t)}
header h1{font-size:18px;margin:0;flex:1}button,select,input{font:inherit;color:var(--t)}
button{padding:8px 14px;border:1px solid var(--b);background:var(--c);border-radius:8px;cursor:pointer}
button.pri{background:linear-gradient(90deg,var(--p),var(--a));color:#fff;border-color:transparent;font-weight:600}button:hover:not(:disabled){border-color:var(--p)}button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--p);outline-offset:2px}
main{display:grid;grid-template-columns:1fr 340px;gap:16px;padding:16px 20px;max-width:1300px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--c);border:1px solid var(--b);border-top:4px solid var(--p);border-radius:12px;padding:16px;margin-bottom:16px}.card:nth-child(even){border-top-color:var(--a)}
h2{font-size:15px;margin:0 0 10px;color:var(--p)}.m{color:var(--m);font-size:13px}
.steps{display:flex;gap:6px;padding:10px 20px;overflow:auto;max-width:1300px;margin:auto}
.st{padding:4px 10px;border-radius:99px;border:1px solid var(--b);font-size:12px;white-space:nowrap;color:var(--m)}.st.on{background:linear-gradient(90deg,var(--p),var(--a));color:#fff;border-color:transparent}
.drop{border:2px dashed var(--b);border-radius:12px;padding:22px;text-align:center;cursor:pointer}.drop.over{border-color:var(--p);background:rgba(30,79,163,.08)}
.req{display:grid;grid-template-columns:34px 1fr 210px 130px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--b)}
@media(max-width:700px){.req{grid-template-columns:30px 1fr}}
.badge{padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor;display:inline-block}
.missing,.expired{color:var(--r)}.expiry-needed{color:var(--o)}.ok{color:var(--g)}.not-provided{color:var(--m)}.badge.missing,.badge.expired{background:var(--rb)}.badge.expiry-needed{background:var(--ob)}.badge.ok{background:var(--gb)}.badge.not-provided{background:var(--nb)}.req:hover{background:rgba(30,79,163,.05)}
select,input[type=date]{width:100%;padding:7px;border:1px solid var(--b);border-radius:8px;background:var(--c)}
.f{padding:8px 0;border-top:1px solid var(--b);font-size:13px;word-break:break-all}.warn{color:var(--o);background:var(--ob);padding:2px 6px;border-radius:6px;display:inline-block}
.sug{font-size:12px;color:var(--p)}.sug button{padding:2px 8px;font-size:12px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;display:none;max-width:90%;z-index:9}
.bar{height:8px;background:var(--b);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p);width:0;transition:width .2s}
</style></head><body>
<header><h1>📑 TenderPack Builder <span id="tid" class="m"></span></h1>
<select id="lang" aria-label="Language" style="width:auto"><option value="en">English</option><option value="bn">বাংলা</option></select>
<button id="help"></button><button id="reset"></button></header>
<div class="steps" id="steps"></div>
<main><div id="left"></div><aside id="right"></aside></main>
<div id="toast" role="alert"></div>
<input type="file" id="jsonIn" accept=".json,application/json" hidden>
<input type="file" id="pdfIn" accept="application/pdf" multiple hidden>
<script>
const T={en:{loadReq:"Load requirements.json",upT:"Upload PDF files",choose:"Choose Files",noTender:"No tender loaded",noTenderS:"Upload requirements.json to begin.",tender:"Tender information",id:"Tender ID",entity:"Procuring entity",bidder:"Bidder",deadline:"Submission deadline",reqs:"Requirements",mand:"Mandatory",opt:"Optional",sel:"Select file…",files:"Uploaded files",drop:"Drop PDF files here or click to browse",lim:"Maximum 30 files / 50 MB",pages:"pages",rm:"Remove",dup:"Duplicate of",matched:"Matched",suggest:"Suggested match",apply:"Apply",exp:"Expiry date",none:"No documents uploaded",summ:"Package readiness",ready:"Ready to generate.",cant:"Package cannot be generated.",gen:"Generate Package",lock:n=>"🔒 Fix "+n+" blocking issue(s) first",help:"Help",reset:"Reset",priv:"Your documents are processed locally in your browser. They are not uploaded to a server.",badJson:"Unable to read requirements.json. Please check that the file follows the required format.",onlyPdf:"Only PDF files are allowed.",tooMany:"Maximum 30 files allowed.",tooBig:"Total size must be 50 MB or less.",badPdf:"Unable to read this PDF. It may be damaged or password protected.",done:"Package generated and downloaded.",genFail:"Could not generate the package.",csv:"Export checklist (CSV)",allgood:"Everything looks good! Your tender package is ready to generate.",helpTxt:"1) Load requirements.json 2) Upload PDFs 3) Match each file to a requirement 4) Enter expiry dates 5) Fix red/orange items 6) Generate.",steps:["Requirements","Upload","Match","Expiry","Review","Generate"],s:{missing:"Missing","expiry-needed":"Expiry date needed",expired:"Expired","not-provided":"Not provided",ok:"OK"}},
bn:{loadReq:"requirements.json লোড করুন",upT:"PDF ফাইল আপলোড",choose:"ফাইল বাছুন",noTender:"কোনো টেন্ডার লোড হয়নি",noTenderS:"শুরু করতে requirements.json আপলোড করুন।",tender:"টেন্ডারের তথ্য",id:"টেন্ডার আইডি",entity:"ক্রয়কারী প্রতিষ্ঠান",bidder:"দরদাতা",deadline:"জমা দেওয়ার শেষ তারিখ",reqs:"প্রয়োজনীয় নথি",mand:"বাধ্যতামূলক",opt:"ঐচ্ছিক",sel:"ফাইল নির্বাচন করুন…",files:"আপলোড করা ফাইল",drop:"PDF ফাইল এখানে ছাড়ুন বা ক্লিক করুন",lim:"সর্বোচ্চ ৩০টি ফাইল / ৫০ এমবি",pages:"পৃষ্ঠা",rm:"মুছুন",dup:"ডুপ্লিকেট:",matched:"মিলানো হয়েছে",suggest:"প্রস্তাবিত মিল",apply:"প্রয়োগ",exp:"মেয়াদ শেষের তারিখ",none:"কোনো নথি আপলোড হয়নি",summ:"প্যাকেজের অবস্থা",ready:"তৈরির জন্য প্রস্তুত।",cant:"প্যাকেজ তৈরি করা যাবে না।",gen:"প্যাকেজ তৈরি করুন",lock:n=>"🔒 আগে "+n+"টি সমস্যা ঠিক করুন",help:"সাহায্য",reset:"রিসেট",priv:"আপনার নথি ব্রাউজারেই প্রসেস হয়। কোনো সার্ভারে আপলোড হয় না।",badJson:"requirements.json পড়া যায়নি। ফাইলটি নির্ধারিত ফরম্যাটে আছে কিনা দেখুন।",onlyPdf:"শুধু PDF ফাইল অনুমোদিত।",tooMany:"সর্বোচ্চ ৩০টি ফাইল অনুমোদিত।",tooBig:"মোট আকার ৫০ এমবি বা কম হতে হবে।",badPdf:"এই PDF পড়া যায়নি। ফাইলটি নষ্ট বা পাসওয়ার্ড-সুরক্ষিত হতে পারে।",done:"প্যাকেজ তৈরি ও ডাউনলোড হয়েছে।",genFail:"প্যাকেজ তৈরি করা যায়নি।",csv:"চেকলিস্ট এক্সপোর্ট (CSV)",allgood:"সব ঠিক আছে! প্যাকেজ তৈরির জন্য প্রস্তুত।",helpTxt:"১) requirements.json লোড করুন ২) PDF আপলোড করুন ৩) প্রতিটি ফাইল মেলান ৪) মেয়াদ দিন ৫) লাল/কমলা সমস্যা ঠিক করুন ৬) তৈরি করুন।",steps:["নথির তালিকা","আপলোড","মিলান","মেয়াদ","পর্যালোচনা","তৈরি"],s:{missing:"নেই","expiry-needed":"মেয়াদ প্রয়োজন",expired:"মেয়াদোত্তীর্ণ","not-provided":"দেওয়া হয়নি",ok:"ঠিক আছে"}}};
const ICON={missing:"🔴","expiry-needed":"🟠",expired:"🔴","not-provided":"⚪",ok:"🟢"};
let S={showUp:false,lang:"en",tender:null,reqs:[],files:[],match:{},exp:{},busy:0,sug:{}};
const t=()=>T[S.lang],$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const e=$("toast");e.textContent=m;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",5000)}
const mb=n=>(n/1048576).toFixed(2)+" MB";
const validDate=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||"")&&!isNaN(Date.parse(d));
// ---- single status function ----
function getRequirementStatus(r,file,expiry,deadline){
  if(!file)return r.mandatory?"missing":"not-provided";
  if(r.has_expiry){if(!validDate(expiry))return "expiry-needed";if(expiry<deadline)return "expired";}
  return "ok";}
const fileOf=r=>S.files.find(f=>f.id===S.match[r.id]);
const statusOf=r=>getRequirementStatus(r,fileOf(r),S.exp[r.id],S.tender.submission_deadline);
const blocking=()=>S.reqs.filter(r=>["missing","expiry-needed","expired"].includes(statusOf(r))).length;
const canGeneratePackage=()=>S.tender&&blocking()===0;
const rname=r=>S.lang==="bn"&&r.title_bn?r.title_bn:r.title_en;
// ---- requirements ----
function parseReq(txt){
  const j=JSON.parse(txt),tn=j.tender;
  for(const k of["tender_id","title","procuring_entity","bidder","submission_deadline"])if(typeof tn[k]!=="string"||!tn[k])throw 0;
  if(!validDate(tn.submission_deadline)||!Array.isArray(j.requirements))throw 0;
  const rs=j.requirements.map(r=>{if(!r.id||typeof r.order!=="number"||!r.title_en)throw 0;
    return{id:String(r.id),order:r.order,title_en:r.title_en,title_bn:r.title_bn||"",mandatory:!!r.mandatory,has_expiry:!!r.has_expiry}}).sort((a,b)=>a.order-b.order);
  return{tender:tn,reqs:rs}}
$("jsonIn").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const p=parseReq(await f.text());S.tender=p.tender;S.reqs=p.reqs;S.match={};S.exp={};S.sug={};render()}catch{toast(t().badJson)}};
// ---- PDFs ----
async function addFiles(list){
  list=[...list];const T_=t();let ok=[];
  for(const f of list){if(f.type!=="application/pdf"&&!/\.pdf$/i.test(f.name)){toast(T_.onlyPdf);continue}ok.push(f)}
  if(S.files.length+ok.length>30){toast(T_.tooMany);return}
  if(S.files.reduce((a,f)=>a+f.size,0)+ok.reduce((a,f)=>a+f.size,0)>50*1048576){toast(T_.tooBig);return}
  S.busy=1;render();
  for(const f of ok){try{
    const buf=await f.arrayBuffer();
    const h=[...new Uint8Array(await crypto.subtle.digest("SHA-256",buf))].map(b=>b.toString(16).padStart(2,"0")).join("");
    const d=await PDFLib.PDFDocument.load(buf);
    S.files.push({id:crypto.randomUUID(),name:f.name,size:f.size,pages:d.getPageCount(),hash:h,buf});
  }catch{toast(f.name+": "+T_.badPdf)}}
  S.busy=0;suggest();render()}
$("pdfIn").onchange=e=>{addFiles(e.target.files);e.target.value=""};
const dupOf=f=>S.files.find(o=>o.hash===f.hash&&o.id!==f.id&&S.files.indexOf(o)<S.files.indexOf(f));
const inDupGroup=f=>S.files.some(o=>o.hash===f.hash&&o.id!==f.id);
function removeFile(id){for(const k in S.match)if(S.match[k]===id){delete S.match[k]}S.files=S.files.filter(f=>f.id!==id);suggest();render()}
function canUse(f,rid){ // one file->one req; duplicates can't match different reqs
  if(Object.entries(S.match).some(([k,v])=>k!==rid&&v===f.id))return false;
  if(S.files.some(o=>o.hash===f.hash&&o.id!==f.id&&Object.entries(S.match).some(([k,v])=>k!==rid&&v===o.id)))return false;
  return true}
function setMatch(rid,fid){if(fid)S.match[rid]=fid;else{delete S.match[rid]}if(!fid||!S.reqs.find(r=>r.id===rid).has_expiry)delete S.exp[rid];suggest();render()}
// ---- auto-match suggestions ----
const norm=s=>s.toLowerCase().replace(/\.pdf$/,"").replace(/[^a-z0-9]+/g," ").trim();
function suggest(){S.sug={};
  for(const r of S.reqs){if(S.match[r.id])continue;
    const toks=norm(r.title_en).split(" ").filter(x=>x.length>1),key=toks.join("");let best=null,bs=0;
    for(const f of S.files){if(!canUse(f,r.id)||Object.values(S.match).includes(f.id))continue;
      const n=norm(f.name),nk=n.replace(/ /g,"");let sc=toks.filter(x=>n.includes(x)).length/(toks.length||1);
      if(nk.includes(key))sc=1;
      const ab=toks.map(x=>x[0]).join("");if(ab.length>1&&n.split(" ").includes(ab))sc=Math.max(sc,.8);
      if(sc>bs){bs=sc;best=f}}
    if(best&&bs>=.5)S.sug[r.id]=best.id}}
// ---- render ----
function render(){
  const T_=t();$("help").textContent=T_.help;$("reset").textContent=T_.reset;
  $("tid").textContent=S.tender?"· "+S.tender.tender_id:"";document.documentElement.lang=S.lang;
  const nb=S.tender?blocking():0,matched=Object.keys(S.match).length;
  const stage=!S.tender?0:!S.files.length?1:!matched?2:S.reqs.some(r=>r.has_expiry&&S.match[r.id]&&!validDate(S.exp[r.id]))?3:nb?4:5;
  $("steps").innerHTML=T_.steps.map((s,i)=>`<span class="st ${i<=stage?"on":""}">${i+1}. ${s}</span>`).join("");
  const dzHtml=!S.showUp?"":`<div class="card"><h2>📤 ${T_.upT} <button type="button" aria-label="Close" style="float:right;padding:2px 8px" onclick="S.showUp=false;render()">✕</button></h2>
  <div class="drop" id="dz" tabindex="0" role="button" onclick="$('pdfIn').click()" onkeydown="if(event.key==='Enter')$('pdfIn').click()"><div style="font-size:34px">📄</div><b>${T_.drop}</b><div class="m" style="margin:6px 0 10px">${T_.lim}</div><button class="pri" type="button">${T_.choose}</button></div>
  ${S.busy?`<div class="bar" style="margin-top:10px"><i style="width:60%"></i></div>`:""}</div>`;
  let L="";
  if(!S.tender)L=`<div class="card" style="text-align:center"><h2>${T_.noTender}</h2><p class="m">${T_.noTenderS}</p><button class="pri" onclick="$('jsonIn').click()">${T_.loadReq}</button></div>`+dzHtml;
  else{const x=S.tender;
    L=`<div class="card"><h2>${T_.tender}</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">
    ${[[T_.id,x.tender_id],["",x.title],[T_.entity,x.procuring_entity],[T_.bidder,x.bidder],[T_.deadline,x.submission_deadline]].map(([k,v])=>`<div><div class="m">${k}</div><b>${esc(v)}</b></div>`).join("")}</div></div>
    ${dzHtml}
    <div class="card"><h2>${T_.reqs}</h2>${S.reqs.map(r=>{
      const st=statusOf(r),f=fileOf(r),sid=S.sug[r.id];
      const opts=S.files.filter(o=>canUse(o,r.id)&&(o.id===S.match[r.id]||!Object.values(S.match).includes(o.id)));
      return `<div class="req"><b>${String(r.order).padStart(2,"0")}</b>
      <div><b>${esc(rname(r))}</b><div class="m">${r.mandatory?T_.mand:T_.opt}${f?` · ${esc(f.name)} · ${f.pages} ${T_.pages}`:""}</div>
      ${sid&&!f?`<div class="sug">💡 ${T_.suggest}: ${esc(S.files.find(o=>o.id===sid).name)} <button onclick="setMatch('${r.id}','${sid}')">${T_.apply}</button></div>`:""}</div>
      <div><select aria-label="${esc(rname(r))}" onchange="setMatch('${r.id}',this.value)"><option value="">${T_.sel}</option>${opts.map(o=>`<option value="${o.id}" ${o.id===S.match[r.id]?"selected":""}>${esc(o.name)}</option>`).join("")}</select>
      ${r.has_expiry&&f?`<label class="m">${T_.exp}<input type="date" value="${S.exp[r.id]||""}" onchange="S.exp['${r.id}']=this.value;render()"></label>`:""}</div>
      <div><span class="badge ${st}">${ICON[st]} ${T_.s[st]}</span></div></div>`}).join("")}</div>`}
  $("left").innerHTML=L;
  const cnt={};if(S.tender)S.reqs.forEach(r=>{const s=statusOf(r);cnt[s]=(cnt[s]||0)+1});
  const okc=cnt.ok||0,tot=S.reqs.length;
  $("right").innerHTML=`<div class="card"><h2>${T_.files}</h2>
  <button class="pri" style="width:100%;margin-bottom:8px" onclick="S.showUp=!S.showUp;render();if(S.showUp)$('dz')?.scrollIntoView({behavior:'smooth',block:'center'})">📤 ${T_.upT}</button>
  ${S.files.length?S.files.map(f=>{const d=dupOf(f)||(inDupGroup(f)&&S.files.find(o=>o.hash===f.hash&&o.id!==f.id)),mr=S.reqs.find(r=>S.match[r.id]===f.id);
    return `<div class="f">📄 <b>${esc(f.name)}</b><br>${f.pages} ${T_.pages} · ${mb(f.size)}
    ${d?`<div class="warn">⚠ ${T_.dup} ${esc(d.name)}</div>`:""}${mr?`<div class="m">${T_.matched}: ${esc(rname(mr))}</div>`:""}
    <button style="padding:2px 8px;margin-top:4px" onclick="removeFile('${f.id}')">${T_.rm}</button></div>`}).join(""):`<p class="m">${T_.none}</p>`}</div>
  ${S.tender?`<div class="card"><h2>${T_.summ}</h2><b>${okc} / ${tot}</b>
   <div>${Object.keys(T_.s).filter(k=>cnt[k]).map(k=>`<div class="${k}">${ICON[k]} ${cnt[k]} ${T_.s[k]}</div>`).join("")}</div>
   <p>${nb?T_.cant:"✅ "+T_.allgood}</p>
   <div class="bar" id="gb" style="display:none"><i></i></div>
   <button class="pri" id="gen" style="width:100%;padding:12px" ${canGeneratePackage()?"":"disabled"} onclick="generate()">${nb?T_.lock(nb):T_.gen}</button>
   <button style="width:100%;margin-top:8px" onclick="exportCsv()">${T_.csv}</button></div>`:""}
  <p class="m">🔒 ${T_.priv}</p>`;
  const dz=$("dz");if(dz){dz.ondragover=e=>{e.preventDefault();dz.classList.add("over")};dz.ondragleave=()=>dz.classList.remove("over");
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove("over");addFiles(e.dataTransfer.files)}}}
// ---- CSV ----
function exportCsv(){const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const rows=[["Document","File Name","Pages","Expiry Date","Status"],...S.reqs.map(r=>{const f=fileOf(r);return[r.title_en,f?.name||"",f?.pages||"",S.exp[r.id]||"",statusOf(r)]})];
  dl(new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"}),S.tender.tender_id+"_Checklist.csv")}
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
// ---- PDF generation ----
async function generate(){
  if(!canGeneratePackage())return;const{PDFDocument,StandardFonts,rgb}=PDFLib,x=S.tender;
  const gb=$("gb"),bar=gb.firstElementChild;gb.style.display="block";$("gen").disabled=true;
  try{
    const inc=S.reqs.filter(r=>fileOf(r)).map(r=>({r,f:fileOf(r)}));
    const total=1+inc.reduce((a,i)=>a+i.f.pages,0);
    const out=await PDFDocument.create(),font=await out.embedFont(StandardFonts.Helvetica),bold=await out.embedFont(StandardFonts.HelveticaBold);
    const fmt=d=>new Date(d+"T00:00:00Z").toLocaleDateString("en-GB",{day:"2-digit",month:"long",year:"numeric",timeZone:"UTC"});
    const cv=out.addPage([595,842]);let y=770;const ink=rgb(.11,.15,.22),blue=rgb(.12,.31,.64);
    cv.drawRectangle({x:0,y:800,width:595,height:42,color:blue});
    cv.drawText("TENDER DOCUMENT PACKAGE",{x:50,y:815,size:16,font:bold,color:rgb(1,1,1)});
    const fit=(s,f,sz,w)=>{while(s.length>3&&f.widthOfTextAtSize(s,sz)>w)s=s.slice(0,-2);return s};
    const wrap=(s,f,sz,w)=>{const o=[];let l="";for(const wd of s.split(" ")){const n=l?l+" "+wd:wd;if(f.widthOfTextAtSize(n,sz)>w&&l){o.push(l);l=wd}else l=n}if(l)o.push(l);return o};
    const lab=(k,v)=>{cv.drawText(k.toUpperCase(),{x:50,y,size:8,font:bold,color:rgb(.4,.45,.55)});y-=15;
      for(const ln of wrap(v,font,13,495)){cv.drawText(ln,{x:50,y,size:13,font,color:ink});y-=16}y-=8};
    y=760;lab("Tender ID",x.tender_id);lab("Title",x.title);lab("Procuring Entity",x.procuring_entity);lab("Bidder",x.bidder);
    lab("Submission Deadline",fmt(x.submission_deadline));lab("Package Created",new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"long",year:"numeric"}));
    y-=6;cv.drawText("INCLUDED DOCUMENTS",{x:50,y,size:11,font:bold,color:blue});y-=20;
    for(const{r}of inc){if(y<70)break;cv.drawText(String(r.order).padStart(2,"0")+"   "+fit(r.title_en,font,11,470),{x:50,y,size:11,font,color:ink});y-=17}
    let n=1;
    for(let i=0;i<inc.length;i++){
      const src=await PDFDocument.load(inc[i].f.buf),emb=await out.embedPdf(src,src.getPageIndices());
      for(const e of emb){const w=e.width,h=e.height,p=out.addPage([w,h+30]);p.drawPage(e,{x:0,y:30});n++;}
      bar.style.width=Math.round((i+1)/inc.length*90)+"%";await new Promise(r=>setTimeout(r));}
    out.getPages().forEach((p,i)=>{const s=`${x.tender_id} | Page ${i+1} of ${total}`,w=font.widthOfTextAtSize(s,9);
      p.drawText(s,{x:(p.getWidth()-w)/2,y:10,size:9,font,color:rgb(.2,.2,.2)})});
    const bytes=await out.save();bar.style.width="100%";
    dl(new Blob([bytes],{type:"application/pdf"}),x.tender_id+"_Package.pdf");toast(t().done);
  }catch(e){toast(t().genFail)}
  render()}
// ---- misc ----
$("lang").onchange=e=>{S.lang=e.target.value;render()};
$("help").onclick=()=>toast(t().helpTxt);
$("reset").onclick=()=>{S={showUp:false,lang:S.lang,tender:null,reqs:[],files:[],match:{},exp:{},busy:0,sug:{}};render()};
render();
</script></body></html>
